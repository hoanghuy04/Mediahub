apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluent-bit
  namespace: bondhub
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fluent-bit-read
rules:
- apiGroups: [""]
  resources:
  - namespaces
  - pods
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fluent-bit-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fluent-bit-read
subjects:
- kind: ServiceAccount
  name: fluent-bit
  namespace: bondhub
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: bondhub
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         1
        Log_Level     info
        Parsers_File  parsers.conf

    [INPUT]
        Name              tail
        Path              /var/log/containers/*.log
        Exclude_Path      /var/log/containers/*fluent-bit*.log,/var/log/containers/*elasticsearch*.log,/var/log/containers/*kafka*.log,/var/log/containers/*kibana*.log,/var/log/containers/*mongodb*.log,/var/log/containers/*neo4j*.log,/var/log/containers/*qdrant*.log,/var/log/containers/*redis*.log,/var/log/containers/*jenkins*.log
        multiline.parser  cri
        Tag               kube.*
        Mem_Buf_Limit     5MB
        Skip_Long_Lines   Off

    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_URL            https://kubernetes.default.svc:443
        Merge_Log           On
        Keep_Log            Off

    [FILTER]
        Name                parser
        Match               kube.*
        Key_Name            message
        Parser              json
        Reserve_Data        On

    # =================================================================
    # 🔍 BỘ LỌC BACKEND: Chỉ giữ lại log từ backend Java
    # =================================================================
    [FILTER]
        Name                grep
        Match               kube.*
        Regex               logger_name ^com\.bondhub\..*$
        Regex               level ^(DEBUG|INFO|WARN|ERROR|FATAL)$

    # =================================================================
    # 🔥 BỘ LỌC CẢNH BÁO: Phân luồng các log lỗi sang tag alert.slack
    # =================================================================
    [FILTER]
        Name                  rewrite_tag
        Match                 kube.*
        Rule                  $level ^(ERROR|FATAL)$                  alert.slack true

    # =================================================================
    # 💾 OUTPUT 1: Đẩy TOÀN BỘ LOG về Elasticsearch
    # =================================================================
    [OUTPUT]
        Name            es
        Match           kube.*
        Host            bh-elasticsearch
        Port            9200
        Index           bondhub-logs
        Suppress_Type_Name On
        Logstash_Format On
        Logstash_Prefix bondhub
        Replace_Dots    On
        Retry_Limit     False

    # =================================================================
    # 🚀 OUTPUT 2: Đẩy log lỗi trực tiếp về kênh Slack 
    # =================================================================
    [OUTPUT]
        Name            slack
        Match           alert.slack
        Webhook         ${SLACK_WEBHOOK_URL}

    [OUTPUT]
        Name            stdout
        Match           alert.slack
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  namespace: bondhub
  labels:
    app: fluent-bit
spec:
  selector:
    matchLabels:
      app: fluent-bit
  template:
    metadata:
      labels:
        app: fluent-bit
    spec:
      serviceAccountName: fluent-bit
      containers:
      - name: fluent-bit
        image: cr.fluentbit.io/fluent/fluent-bit:2.1.10
        imagePullPolicy: Always
        env:
        - name: SLACK_WEBHOOK_URL
          valueFrom:
            secretKeyRef:
              name: fluentbit-secrets
              key: SLACK_WEBHOOK_URL
        volumeMounts:
        - name: varlog
          mountPath: /var/log
        - name: varlibdockercontainers
          mountPath: /var/lib/docker/containers
          readOnly: true
        - name: config
          mountPath: /fluent-bit/etc/fluent-bit.conf
          subPath: fluent-bit.conf
      volumes:
      - name: varlog
        hostPath:
          path: /var/log
      - name: varlibdockercontainers
        hostPath:
          path: /var/lib/docker/containers
      - name: config
        configMap:
          name: fluent-bit-config